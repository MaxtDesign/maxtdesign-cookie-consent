# CI: build and test on push/PR
name: CI

on:
  push:
    branches: [main, master, feature/asset-optimization]
  pull_request:
    branches: [main, master, feature/asset-optimization]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Validate asset sizes
        run: npm run validate

      - name: Run tests
        run: npm run test
